[www]
user = www-data
group = www-data

listen = 9000

; Naikkan request_terminate_timeout agar PHP-FPM worker tidak di-kill
; sebelum request selesai. Harus >= nginx fastcgi_read_timeout.
request_terminate_timeout = 300

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
