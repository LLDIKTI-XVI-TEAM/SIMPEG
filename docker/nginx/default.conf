server {
    listen 80;
    server_name localhost;
    client_max_body_size 100M;

    root /var/www/html/public;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Serve storage directory directly to avoid symlink issues in Podman/Windows
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        autoindex off;
        access_log off;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Naikkan timeout agar request berat (bulk restore, export, import) tidak 504
        fastcgi_read_timeout    300;
        fastcgi_send_timeout    300;
        fastcgi_connect_timeout 60;

        # Buffer response dari PHP-FPM agar tidak disconnect lebih awal
        fastcgi_buffer_size          128k;
        fastcgi_buffers              8 256k;
        fastcgi_busy_buffers_size    256k;
    }

    location ~ /\.ht {
        deny all;
    }
}
