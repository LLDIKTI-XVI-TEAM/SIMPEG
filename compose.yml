services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: simpeg_app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html:Z
    depends_on:
      db:
        condition: service_started
    networks:
      - simpeg_net

  nginx:
    image: docker.io/library/nginx:alpine
    container_name: simpeg_nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:Z
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,Z
    depends_on:
      - app
    networks:
      - simpeg_net

  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: simpeg_mailpit
    ports:
      - "8025:8025"
    networks:
      - simpeg_net

  db:
    image: docker.io/library/postgres:17
    container_name: simpeg_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: simpeg
      POSTGRES_USER: simpeg
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data:Z
    networks:
      - simpeg_net

networks:
  simpeg_net:
    driver: bridge

volumes:
  pg_data:
