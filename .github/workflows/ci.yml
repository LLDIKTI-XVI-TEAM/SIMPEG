name: CI

# Jalankan gerbang kualitas penuh pada pull request sebelum perubahan digabung.
# Push hasil squash merge ke development cukup menjalankan smoke PostgreSQL agar
# gate penuh yang sudah lulus pada head PR tidak dibayar ulang. Push langsung,
# lookup API gagal, atau metadata ambigu tetap menjalankan full QA.
on:
  pull_request:
    branches: [development, main]
  merge_group:
    branches: [development, main]
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Push development memakai SHA agar fallback full QA tidak dibatalkan oleh push berikutnya.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: ${{ github.event_name != 'push' && 'Pint + PHPStan + JavaScript + Test' || 'Development squash verification' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: simpeg_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d simpeg_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: simpeg_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Verify development squash merge
        id: development_push
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PUSH_SHA: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          mode=full

          # Hanya squash commit hasil merge PR ke branch tujuan yang boleh memakai smoke.
          if matched_pr="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPOSITORY}/commits/${PUSH_SHA}/pulls?per_page=100" \
            --jq ".[] | select(.merged_at != null and .merge_commit_sha == \"${PUSH_SHA}\" and .base.ref == \"${TARGET_BRANCH}\") | .number" \
            2>/dev/null)" \
            && [[ -n "${matched_pr}" ]]; then
            mode=smoke
          fi

          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          echo "Development push mode: ${mode}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql, pgsql, zip, bcmath, intl, gd
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Verify PostgreSQL connection
        run: php artisan db:show --database=pgsql

      - name: Run Pint format check
        if: github.event_name != 'push' || steps.development_push.outputs.mode != 'smoke'
        run: composer format:check

      - name: Run PHPStan static analysis
        if: github.event_name != 'push' || steps.development_push.outputs.mode != 'smoke'
        run: composer analyse

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run JavaScript tests
        if: github.event_name != 'push' || steps.development_push.outputs.mode != 'smoke'
        run: npm run test:js

      - name: Build frontend assets
        # Sebagian view Blade memakai @vite() yang butuh public/build/manifest.json.
        # Tanpa build ini, test yang merender view gagal 500 (ViteManifestNotFoundException).
        run: npm run build

      - name: Run safe Laravel tests in parallel
        if: github.event_name != 'push' || steps.development_push.outputs.mode != 'smoke'
        run: composer test:ci:parallel

      - name: Run serial Laravel tests
        if: github.event_name != 'push' || steps.development_push.outputs.mode != 'smoke'
        run: composer test:ci:serial

      - name: Run guarded destructive migration tests
        # Step terakhir pada jalur full sengaja mereset simpeg_test setelah suite utama selesai.
        if: github.event_name != 'push' || steps.development_push.outputs.mode != 'smoke'
        env:
          SIMPEG_ALLOW_DESTRUCTIVE_MIGRATION_TESTS: 'true'
        run: composer test:ci:guarded

      - name: Run development smoke tests
        if: github.event_name == 'push' && steps.development_push.outputs.mode == 'smoke'
        run: >-
          php -d memory_limit=-1 artisan test
          tests/Feature/ExampleTest.php
          --fail-on-skipped
